name: Publish NuGet Package

# Triggers on a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# Uses NuGet.org Trusted Publishing (OIDC) - no stored API key needed. This
# must match the trusted publishing policy configured on nuget.org: repo
# qumbarraza/PdfMerge, workflow file publish.yml, environment "production",
# glob pattern "Shark.PDFMerge" (the package ID, set in PdfMerge.Core.csproj).
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # required to obtain the OIDC token for Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore PdfMerge.slnx

      - name: Build
        run: dotnet build PdfMerge.slnx --no-restore -c Release

      - name: Pack
        run: >
          dotnet pack src/PdfMerge.Core/PdfMerge.Core.csproj
          --no-build -c Release -o out
          -p:Version=${{ steps.version.outputs.version }}

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: qumbar.raza

      - name: Push to NuGet.org
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
